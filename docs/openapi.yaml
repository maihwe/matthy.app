components:
  schemas:
    AssignRoleInputRequest:
      type: object
      properties:
        role:
          type: string
          format: uuid
      required:
      - role
    Country:
      type: object
      description: |-
        A country and the currency it uses.

        ``currency`` is a two-way field in the response: the code, not a nested
        object, because the caller's next request is ``?country=NG`` and not a web
        of joins.
      properties:
        iso2:
          type: string
          maxLength: 2
        iso3:
          type: string
          maxLength: 3
        name:
          type: string
          maxLength: 100
        dial_code:
          type: string
          description: E.164 dialling prefix including '+', e.g. '+234'.
          maxLength: 8
        currency:
          type: string
          readOnly: true
        default_locale:
          type: string
          maxLength: 16
      required:
      - currency
      - dial_code
      - iso2
      - iso3
      - name
    CountryTypeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LocationType'
      required:
      - data
    Dashboard:
      type: object
      properties:
        active_members:
          type: integer
          readOnly: true
        pending_approvals:
          type: integer
          readOnly: true
        roles:
          type: integer
          readOnly: true
      required:
      - active_members
      - pending_approvals
      - roles
    DashboardResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Dashboard'
      required:
      - data
    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
