AWSTemplateFormatVersion: '2010-09-09'
Description: IHWEZA staging registry and GitHub deployment identity; no application resources.
Parameters:
  GitHubRepository:
    Type: String
    Default: maihwe/matthy.app
    AllowedPattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
  ExistingOidcProviderArn:
    Type: String
    Default: ''
    Description: Reuse the account's GitHub OIDC provider if one already exists.
Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, '']
Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  ImageRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: ihweza-staging
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Remove untagged build layers after seven days",
          "selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":7},
          "action":{"type":"expire"}}]}
  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ihweza-staging-github
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidcProvider, !Ref GitHubOidcProvider, !Ref ExistingOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:staging
      Policies:
        - PolicyName: StagingRelease
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                  - ecr:DescribeImageScanFindings
                Resource: !GetAtt ImageRepository.Arn
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/ihweza-staging/*
              - Effect: Allow
                Action: [ecs:DescribeServices, ecs:UpdateService]
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/ihweza-staging/ihweza-staging-web
              - Effect: Allow
                Action: ecs:DescribeTaskDefinition
                Resource: '*'
              - Effect: Allow
                Action: ecs:RegisterTaskDefinition
                Resource: '*'
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/ihweza-staging-web:*
                Condition:
                  ArnEquals:
                    ecs:cluster: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/ihweza-staging
              - Effect: Allow
                Action: [ecs:DescribeTasks, ecs:StopTask]
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/ihweza-staging/*
                Condition:
                  ArnEquals:
                    ecs:cluster: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/ihweza-staging
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ihweza-staging-execution
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ihweza-staging-runtime
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
Outputs:
  DeploymentRoleArn:
    Value: !GetAtt DeploymentRole.Arn
  ImageRepositoryUri:
    Value: !GetAtt ImageRepository.RepositoryUri
