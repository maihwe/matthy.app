AWSTemplateFormatVersion: '2010-09-09'
Description: IHWEZA AWS staging; private Fargate, PostgreSQL 16 and Redis 7.1. Starts with zero web tasks.
Parameters:
  ApplicationSecretArn:
    Type: String
    AllowedPattern: 'arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+'
    Description: JSON staging secret prepared with scripts/aws_staging_secrets.py.
  ImageUri:
    Type: String
    AllowedPattern: '[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/ihweza-staging@sha256:[a-f0-9]{64}'
    Description: Production image published by AWS staging workflow, identified by digest.
  StagingHostname:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9.-]+\.[a-z]{2,}'
  CertificateArn:
    Type: String
    AllowedPattern: 'arn:aws:acm:[a-z0-9-]+:[0-9]{12}:certificate/.+'
    Description: Issued ACM certificate for StagingHostname in this region.
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.small
    AllowedValues: [db.t4g.small, db.t4g.medium]
  DatabaseEngineVersion:
    Type: String
    Default: '16.15'
    AllowedPattern: '16\.[0-9]+(-R[0-9]+)?'
    Description: Confirm availability in the chosen region before creating a change set.
  CacheNodeType:
    Type: String
    Default: cache.t4g.small
    AllowedValues: [cache.t4g.micro, cache.t4g.small, cache.t4g.medium]
  HighAvailability:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable database standby and Redis replica; one NAT remains a staging limitation.
  WebDesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1, 2]
    Description: Zero for initial creation; preserve the live count during infrastructure updates.
Conditions:
  UseHighAvailability: !Equals [!Ref HighAvailability, 'true']
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: ihweza-staging}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable
  PublicAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable
  NatAddress:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: PublicAssociationA
    Properties:
      SubnetId: !Ref PublicSubnetA
      AllocationId: !GetAtt NatAddress.AllocationId
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  OutboundRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  PrivateAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable
  PrivateAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS and HTTP redirect
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 8000, ToPort: 8001, CidrIp: 10.42.0.0/16}
  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Application and readiness port accessible only from load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8001
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, CidrIp: 10.42.0.0/16}
        - {IpProtocol: tcp, FromPort: 6379, ToPort: 6379, CidrIp: 10.42.0.0/16}
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL accessible only from application tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ApplicationSecurityGroup
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 127.0.0.1/32}
  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Authenticated Redis accessible only from application tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref ApplicationSecurityGroup
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 127.0.0.1/32}
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private staging database subnets
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
  DatabaseParameters:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: Require encrypted PostgreSQL connections
      Family: postgres16
      Parameters:
        rds.force_ssl: '1'
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: ihweza-staging
      Engine: postgres
      EngineVersion: !Ref DatabaseEngineVersion
      AutoMinorVersionUpgrade: true
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: '20'
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      DBName: matthy_staging
      MasterUsername: matthy_admin
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      DBParameterGroupName: !Ref DatabaseParameters
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: !If [UseHighAvailability, true, false]
      BackupRetentionPeriod: 30
      CopyTagsToSnapshot: true
      DeletionProtection: true
      EnableCloudwatchLogsExports: [postgresql, upgrade]
  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Private staging Redis subnets
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
  CacheParameters:
    Type: AWS::ElastiCache::ParameterGroup
    Properties:
      Description: Do not evict sessions, throttles or queued work under memory pressure
      CacheParameterGroupFamily: redis7
      Properties:
        maxmemory-policy: noeviction
  Cache:
    Type: AWS::ElastiCache::ReplicationGroup
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      ReplicationGroupId: ihweza-staging
      ReplicationGroupDescription: Staging cache and task broker
      Engine: redis
      EngineVersion: '7.1'
      CacheNodeType: !Ref CacheNodeType
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      CacheParameterGroupName: !Ref CacheParameters
      SecurityGroupIds: [!Ref CacheSecurityGroup]
      NumCacheClusters: !If [UseHighAvailability, 2, 1]
      AutomaticFailoverEnabled: !If [UseHighAvailability, true, false]
      MultiAZEnabled: !If [UseHighAvailability, true, false]
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
      AuthToken: !Sub '{{resolve:secretsmanager:${ApplicationSecretArn}:SecretString:REDIS_AUTH_TOKEN}}'
      SnapshotRetentionLimit: 7
      AutoMinorVersionUpgrade: true
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: ihweza-staging
      ClusterSettings: [{Name: containerInsights, Value: enabled}]
  ApplicationLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /ihweza/staging/application
      RetentionInDays: 30
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ihweza-staging-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: StagingApplicationSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ApplicationSecretArn
  RuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ihweza-staging-runtime
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
  DatabaseBootstrapRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ihweza-staging-database-bootstrap
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: InitializeDatabaseOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref ApplicationSecretArn, !GetAtt Database.MasterUserSecret.SecretArn]
  DatabaseBootstrapTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: ihweza-staging-database-bootstrap
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt DatabaseBootstrapRole.Arn
      TaskRoleArn: !GetAtt RuntimeRole.Arn
      ContainerDefinitions:
        - Name: initialize-database
          Image: !Ref ImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          EntryPoint: [python, scripts/aws_initialize_database.py]
          Environment:
            - {Name: POSTGRES_HOST, Value: !GetAtt Database.Endpoint.Address}
            - {Name: POSTGRES_DB, Value: matthy_staging}
            - {Name: POSTGRES_USER, Value: matthy_staging}
          Secrets:
            - Name: RDS_ADMIN_USERNAME
              ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:username::'
            - Name: RDS_ADMIN_PASSWORD
              ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:password::'
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Sub '${ApplicationSecretArn}:POSTGRES_PASSWORD::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApplicationLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: bootstrap
  WebTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: ihweza-staging-web
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt RuntimeRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ContainerDefinitions:
        - Name: web
          Image: !Ref ImageUri
          Essential: true
          StopTimeout: 60
          PortMappings: [{ContainerPort: 8000, Protocol: tcp}]
          Environment:
            - {Name: DJANGO_SETTINGS_MODULE, Value: config.settings.staging}
            - {Name: DJANGO_DEBUG, Value: 'false'}
            - {Name: DJANGO_LOG_LEVEL, Value: INFO}
            - {Name: DJANGO_ALLOWED_HOSTS, Value: !Ref StagingHostname}
            - {Name: DJANGO_CSRF_TRUSTED_ORIGINS, Value: !Sub 'https://${StagingHostname}'}
            - {Name: HEALTHCHECK_HOST, Value: !Ref StagingHostname}
            - {Name: POSTGRES_HOST, Value: !GetAtt Database.Endpoint.Address}
            - {Name: POSTGRES_DB, Value: matthy_staging}
            - {Name: POSTGRES_USER, Value: matthy_staging}
            - {Name: PGSSLMODE, Value: require}
            - {Name: GUNICORN_WORKERS, Value: '2'}
            - {Name: JWT_ISSUER, Value: ihweza-staging}
            - {Name: JWT_AUDIENCE, Value: ihweza-staging-api}
          Secrets:
            - Name: DJANGO_SECRET_KEY
              ValueFrom: !Sub '${ApplicationSecretArn}:DJANGO_SECRET_KEY::'
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Sub '${ApplicationSecretArn}:POSTGRES_PASSWORD::'
            - Name: REDIS_URL
              ValueFrom: !Sub '${ApplicationSecretArn}:REDIS_URL::'
            - Name: JWT_SIGNING_KEY
              ValueFrom: !Sub '${ApplicationSecretArn}:JWT_SIGNING_KEY::'
            - Name: JWT_VERIFYING_KEY
              ValueFrom: !Sub '${ApplicationSecretArn}:JWT_VERIFYING_KEY::'
            - Name: MFA_ENCRYPTION_KEYS
              ValueFrom: !Sub '${ApplicationSecretArn}:MFA_ENCRYPTION_KEYS::'
            - Name: PHONE_VERIFICATION_BACKEND
              ValueFrom: !Sub '${ApplicationSecretArn}:PHONE_VERIFICATION_BACKEND::'
          HealthCheck:
            Command: [CMD, python, /app/docker/healthcheck.py]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApplicationLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web
        - Name: readiness
          Image: !Ref ImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          EntryPoint: [python, -m, docker.readiness_server]
          PortMappings: [{ContainerPort: 8001, Protocol: tcp}]
          DependsOn: [{ContainerName: web, Condition: START}]
          Environment:
            - {Name: HEALTHCHECK_HOST, Value: !Ref StagingHostname}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApplicationLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: readiness
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: [InternetRoute, PublicAssociationA, PublicAssociationB]
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
        - {Key: routing.http.desync_mitigation_mode, Value: strictest}
  Targets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPort: '8001'
      HealthCheckPath: /health/ready/
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: {Protocol: HTTPS, Port: '443', StatusCode: HTTP_301}
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: '404', ContentType: text/plain, MessageBody: Unknown host}
  HostRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: host-header
          HostHeaderConfig: {Values: [!Ref StagingHostname]}
      Actions: [{Type: forward, TargetGroupArn: !Ref Targets}]
  WebService:
    Type: AWS::ECS::Service
    DependsOn: [HostRule, OutboundRoute, PrivateAssociationA, PrivateAssociationB]
    Properties:
      ServiceName: ihweza-staging-web
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WebTask
      DesiredCount: !Ref WebDesiredCount
      LaunchType: FARGATE
      PlatformVersion: '1.4.0'
      EnableExecuteCommand: false
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
          SecurityGroups: [!Ref ApplicationSecurityGroup]
      LoadBalancers:
        - {ContainerName: web, ContainerPort: 8000, TargetGroupArn: !Ref Targets}
Outputs:
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt WebService.Name
  TaskDefinitionArn:
    Value: !Ref WebTask
  DatabaseBootstrapTaskArn:
    Value: !Ref DatabaseBootstrapTask
  PrivateSubnetIds:
    Value: !Join [',', [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
  ApplicationSecurityGroupId:
    Value: !Ref ApplicationSecurityGroup
  CacheHostname:
    Value: !GetAtt Cache.PrimaryEndPoint.Address
  LoadBalancerHostname:
    Value: !GetAtt LoadBalancer.DNSName
  LoadBalancerHostedZoneId:
    Value: !GetAtt LoadBalancer.CanonicalHostedZoneID
  StagingUrl:
    Value: !Sub https://${StagingHostname}
