[project]
name = "matthy-app"
version = "0.1.0"
description = "IHWEZA — community contribution, savings, borrowing & disbursement platform"
requires-python = ">=3.12"

# ---------------------------------------------------------------------------
# ruff — CI gates 1 and 2 (11 §6)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv", "docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "RUF",  # ruff-specific
]
ignore = [
    "S101",   # assert — used deliberately throughout the test suite
    "E501",   # line length is enforced by the formatter
    # DJ001 — "avoid null=True on string-based fields". Overridden, not
    # overlooked, because following it would break the schema.
    #
    # 03 specifies NULL for these columns throughout (`users.email`,
    # `users.username`, `users.pin_hash`, `audit_logs.user_agent`,
    # `user_profiles.address_line`, ...), and in each case NULL carries a meaning
    # an empty string cannot: "no PIN has been set" is not "the PIN is the empty
    # string", and `check_pin` has to be able to tell them apart.
    #
    # The decisive case is `users.email`. It is unique under a functional index
    # on `Lower(email)` with NULLs distinct, so any number of members may have no
    # email address. Rewriting it to `blank=True, default=""` — which is what
    # DJ001 asks for — would make the second member without an email collide with
    # the first, and registration would fail with a duplicate-key error for a
    # field they left blank. The rule's advice is written for models where "" and
    # NULL are interchangeable; here they are not.
    "DJ001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]        # noqa: allow dummy credentials in factories
"config/settings/**" = ["S105"]      # setting names read as hard-coded secrets to bandit

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# SEC-INJ-004 — no pickle, no unsafe YAML loading. Note that `eval` and `exec`
# are covered by bandit's S307 and pickle by S301, both enabled via the "S"
# ruleset above; `banned-api` only inspects imports, so it cannot catch a call
# to a builtin and is not the control for those.
"pickle".msg = "SEC-INJ-004: never unpickle untrusted data"
"marshal".msg = "SEC-INJ-004: unpickling by another name"
"shelve".msg = "SEC-INJ-004: shelve is pickle underneath"
"dill".msg = "SEC-INJ-004: never unpickle untrusted data"

# ---------------------------------------------------------------------------
# mypy — CI gate 3 (11 §6)
#
# Strict on the financial modules. A `float` where an `int` was meant is the
# money bug this project most needs not to have, and mypy catches it at the
# boundary before it reaches the ledger. The financial modules do not exist
# yet; their override is declared now so it is in force from the first commit
# that creates them.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
exclude = ["migrations/", "\\.venv/"]

[[tool.mypy.overrides]]
module = [
    "apps.ledger.*",
    "apps.payments.*",
    "apps.loans.*",
    "apps.disbursements.*",
    "apps.contributions.*",
]
strict = true

[[tool.mypy.overrides]]
module = ["apps.*.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# `phonenumbers` is autogenerated from Google's libphonenumber and may or may not
# ship a `py.typed` marker depending on the release; whether it does is not
# something this project controls or should be broken by. Without this, an
# unrelated `library stubs not installed` error fails gate 3 and hides the real
# findings. `ignore_missing_imports` on a module that *does* ship types is inert,
# so this is correct either way — unlike a per-line `# type: ignore`, which
# `warn_unused_ignores` would turn into an error the moment the marker appears.
#
# Both spellings are listed because mypy matches `foo.*` against submodules only:
# `import phonenumbers` is the top-level module and would not be covered by the
# wildcard alone.
module = ["phonenumbers", "phonenumbers.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

# ---------------------------------------------------------------------------
# pytest — CI gate 6 (11 §6), suites 6a–6e (13 §10)
#
# Integration and concurrency tests run against real PostgreSQL, never SQLite:
# the schema depends on CHECK constraints, deferred constraint triggers,
# GENERATED columns, CITEXT and JSONB (13 §3). A SQLite run would pass while
# the production invariants never fired.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "unit: pure logic, no database (13 §2)",
    "integration: service + real PostgreSQL (13 §2)",
    "api: endpoint contract tests (13 §2)",
    "concurrency: lock ordering, double-spend, lost update (13 §2)",
    "security: auth, authz, enumeration, tampering (13 §2)",
    "reconciliation: ledger vs cache vs provider (13 §2)",
    "e2e: full journeys across subsystems (13 §2)",
    "slow: excluded from the default local run",
]

[tool.coverage.run]
branch = true
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*", "config/settings/*", "config/celery.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# A coarse backstop only. 13 §9 specifies FOUR per-scope floors (100% branch
# for ledger/, 95% financial, 90% accounts/groups, 80% line elsewhere), which
# coverage.py's single `fail_under` cannot express — so the real gate is
# scripts/check_coverage.py, run by CI. This value exists so that a local
# `coverage report` also refuses an obviously broken run.
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
